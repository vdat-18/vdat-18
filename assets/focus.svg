<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 244" width="1000" height="244" role="img" aria-label="Focus areas">
<style>
:root{--cell:#f3f4f6;--line:#dfe2e7;--ink:#1f2328;--mut:#59606b}
@media (prefers-color-scheme:dark){:root{--cell:#1b1f26;--line:#2b313b;--ink:#e6e9ee;--mut:#9aa3b0}}
.cell{fill:var(--cell);stroke:var(--line);stroke-width:1}
.ct{font:700 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.cd{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--mut)}
.p{opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
<g class="p" style="animation-delay:0.00s"><rect class="cell" x="0" y="0" width="490" height="112" rx="12"/><rect x="0" y="22" width="3" height="26" fill="#f2b544"/><text class="ct" x="24" y="42">LLM applications</text><text class="cd" x="24" y="68">Production multi-agent systems and</text><text class="cd" x="24" y="88">tool-calling flows, from orchestration to</text><text class="cd" x="24" y="108">backend APIs.</text></g>
<g class="p" style="animation-delay:0.12s"><rect class="cell" x="510" y="0" width="490" height="112" rx="12"/><rect x="510" y="22" width="3" height="26" fill="#f2b544"/><text class="ct" x="534" y="42">Cost and latency</text><text class="cd" x="534" y="68">Model routing, small models for sub-agents,</text><text class="cd" x="534" y="88">caching, and low-latency hybrid retrieval.</text></g>
<g class="p" style="animation-delay:0.24s"><rect class="cell" x="0" y="132" width="490" height="112" rx="12"/><rect x="0" y="154" width="3" height="26" fill="#f2b544"/><text class="ct" x="24" y="174">Accuracy and evaluation</text><text class="cd" x="24" y="200">Eval sets with expected tool calls, RAGAS</text><text class="cd" x="24" y="220">metrics, DSPy prompt optimization, Langfuse</text><text class="cd" x="24" y="240">tracing.</text></g>
<g class="p" style="animation-delay:0.36s"><rect class="cell" x="510" y="132" width="490" height="112" rx="12"/><rect x="510" y="154" width="3" height="26" fill="#f2b544"/><text class="ct" x="534" y="174">Ontology GraphRAG</text><text class="cd" x="534" y="200">Ontology-guided knowledge graphs with Graphiti</text><text class="cd" x="534" y="220">and Neo4j, hybrid BM25 and vector retrieval.</text></g>
</svg>