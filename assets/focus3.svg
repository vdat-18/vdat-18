<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Focus areas">
<style>
:root{--cell:#f3f4f6;--line:#dfe2e7;--ink:#1f2328;--mut:#59606b;--acc:#b97a0a}
@media (prefers-color-scheme:dark){:root{--cell:#1b1f26;--line:#2b313b;--ink:#e6e9ee;--mut:#9aa3b0;--acc:#f2b544}}
.cell{fill:var(--cell);stroke:var(--line);stroke-width:1}
.n{font:700 13px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2px;fill:var(--acc)}
.ct{font:700 18px 'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.cd{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--mut)}
.p{opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
<g class="p" style="animation-delay:0.00s"><rect class="cell" x="0" y="0" width="320" height="176" rx="12"/><text class="n" x="24" y="36" dominant-baseline="central">01</text><text class="ct" x="24" y="66" dominant-baseline="central">Multi-agent LLM apps</text><text class="cd" x="24" y="98" dominant-baseline="central">Orchestrator and specialist agents,</text><text class="cd" x="24" y="120" dominant-baseline="central">50+ tools, memory and context across</text><text class="cd" x="24" y="142" dominant-baseline="central">long conversations.</text></g>
<g class="p" style="animation-delay:0.10s"><rect class="cell" x="340" y="0" width="320" height="176" rx="12"/><text class="n" x="364" y="36" dominant-baseline="central">02</text><text class="ct" x="364" y="66" dominant-baseline="central">Ontology GraphRAG</text><text class="cd" x="364" y="98" dominant-baseline="central">Ontology-guided knowledge graphs on</text><text class="cd" x="364" y="120" dominant-baseline="central">Neo4j and Graphiti, with consistent</text><text class="cd" x="364" y="142" dominant-baseline="central">terms and entity resolution.</text></g>
<g class="p" style="animation-delay:0.20s"><rect class="cell" x="680" y="0" width="320" height="176" rx="12"/><text class="n" x="704" y="36" dominant-baseline="central">03</text><text class="ct" x="704" y="66" dominant-baseline="central">Hybrid retrieval</text><text class="cd" x="704" y="98" dominant-baseline="central">BM25, vectors, and rank fusion with</text><text class="cd" x="704" y="120" dominant-baseline="central">reranking, built for Korean, Thai,</text><text class="cd" x="704" y="142" dominant-baseline="central">and Vietnamese text.</text></g>
<g class="p" style="animation-delay:0.30s"><rect class="cell" x="0" y="196" width="320" height="176" rx="12"/><text class="n" x="24" y="232" dominant-baseline="central">04</text><text class="ct" x="24" y="262" dominant-baseline="central">Accuracy and evaluation</text><text class="cd" x="24" y="294" dominant-baseline="central">Eval sets with expected agents and</text><text class="cd" x="24" y="316" dominant-baseline="central">tool calls, RAGAS, and DSPy prompt</text><text class="cd" x="24" y="338" dominant-baseline="central">optimization.</text></g>
<g class="p" style="animation-delay:0.40s"><rect class="cell" x="340" y="196" width="320" height="176" rx="12"/><text class="n" x="364" y="232" dominant-baseline="central">05</text><text class="ct" x="364" y="262" dominant-baseline="central">Cost and latency</text><text class="cd" x="364" y="294" dominant-baseline="central">Large model to orchestrate, small</text><text class="cd" x="364" y="316" dominant-baseline="central">models for sub-agents, model routing,</text><text class="cd" x="364" y="338" dominant-baseline="central">Redis caching.</text></g>
<g class="p" style="animation-delay:0.50s"><rect class="cell" x="680" y="196" width="320" height="176" rx="12"/><text class="n" x="704" y="232" dominant-baseline="central">06</text><text class="ct" x="704" y="262" dominant-baseline="central">Self-hosted and observable</text><text class="cd" x="704" y="294" dominant-baseline="central">Open models on vLLM, with Langfuse,</text><text class="cd" x="704" y="316" dominant-baseline="central">Grafana, and Prometheus watching</text><text class="cd" x="704" y="338" dominant-baseline="central">every run.</text></g>
</svg>