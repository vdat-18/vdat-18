<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 368" width="1000" height="368" role="img" aria-label="Tech stack">
<style>
:root{--cell:#f3f4f6;--line:#dfe2e7;--ink:#1f2328;--mut:#6b7380}
@media (prefers-color-scheme:dark){:root{--cell:#1b1f26;--line:#2b313b;--ink:#e6e9ee;--mut:#8b94a3}}
.cell{fill:var(--cell);stroke:var(--line);stroke-width:1}
.dot{fill:#f2b544}
.t{font:500 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.h{font:700 12px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:3px;fill:var(--mut)}
.p{opacity:0;animation:pop .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
<g class="p" style="animation-delay:0.00s"><rect class="cell" x="0" y="6" width="188" height="46" rx="10"/><circle class="dot" cx="20" cy="29.0" r="4"/><text class="t" x="36" y="29.0" dominant-baseline="central">Python</text></g>
